name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token grants far more than a test run needs, and any action in
# the job inherits it. Raise individual permissions only where required.
permissions:
  contents: read

# Cancel superseded runs: without this, every push to an open pull request
# builds an already-obsolete commit to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: {{#if has.testing}}Lint, typecheck and test{{/if}}{{#unless has.testing}}Lint and typecheck{{/unless}}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Enabled only once a lockfile is committed. `cache: npm` does not
          # degrade when there is no lockfile — it fails the job outright,
          # before a single script runs, which is exactly the state this
          # project is in until someone has installed dependencies.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      # `npm ci` also requires a lockfile, so the first run on a freshly
      # generated project installs instead. Every run after that takes the
      # reproducible path. Commit package-lock.json and this stops branching.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json yet — installing. Commit the lockfile to get reproducible CI installs."
            npm install
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
{{#if has.testing}}
      - name: Test
        run: npm test
{{/if}}
      - name: Format
        run: npm run format:check
