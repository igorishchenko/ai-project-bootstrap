# Publishes on a `vX.Y.Z` tag pushed to main — see .claude/commands/release.md
# for the procedure that produces the tag.
#
# Authenticates to npm with trusted publishing (OIDC) — there is no token in
# this repository. The one-time setup is on npmjs.com: the package's Settings →
# Trusted Publisher, pointing at this repository and this workflow file. Change
# either of those names and npm stops recognising the publisher.
#
# The previous arrangement was an `NPM_TOKEN` secret, and it never published
# once: whatever was in it needed a one-time password, so v1.5.0 and v1.5.1 both
# failed at `npm publish` with EOTP. A token cannot be the wrong type if there
# is no token.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write # cut the GitHub Release
  id-token: write # mint the OIDC token npm exchanges for a publish credential

jobs:
  publish:
    name: Publish to npm and cut the GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Deliberately no `registry-url`: it makes setup-node write an .npmrc
      # pinning the registry to ${NODE_AUTH_TOKEN}, which is now unset, and an
      # empty auth line is worse than none — npm reads it as "authenticate with
      # this token" and never reaches the OIDC exchange. The default registry is
      # registry.npmjs.org and package.json declares no publishConfig, so there
      # is nothing for it to override.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing landed in npm 11.5.1, and the npm bundled with the
      # Node 22 image predates it. Without this the publish below falls back to
      # looking for a token that is deliberately not here.
      - name: npm new enough to publish without a token
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tag is the only trigger, so a tag that disagrees with package.json
      # would publish a version nobody wrote release notes for.
      - name: The tag agrees with package.json
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Lint, typecheck and test
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      # Both halves of publish auth, checked before `npm publish` gets far
      # enough to sign anything. The EOTP that killed v1.5.0 and v1.5.1 surfaced
      # only after provenance had been signed and published to the transparency
      # log, and read like a mistyped 2FA code rather than the wrong kind of
      # credential — an error that sends you to the wrong place costs more than
      # the failure itself.
      - name: Preflight — this job can actually authenticate
        run: |
          installed=$(npm --version)
          if ! npx --yes semver@7 -r '>=11.5.1' "$installed" >/dev/null 2>&1; then
            echo "::error::npm $installed cannot use trusted publishing; needs >= 11.5.1"
            exit 1
          fi
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::No OIDC token available. This job needs id-token: write, and trusted publishing cannot work without it."
            exit 1
          fi
          if grep -rqs '_authToken' ~/.npmrc .npmrc 2>/dev/null; then
            echo "::error::An .npmrc is setting _authToken. Trusted publishing needs no token, and an empty or stale one is used in preference to the OIDC exchange."
            exit 1
          fi
          echo "npm $installed, OIDC token endpoint present, no competing .npmrc auth."

      # `prepublishOnly` runs `pnpm build && pnpm check:publishable`, so the
      # tarball is built and audited by the publish itself. A tarball missing
      # config/, technologies/, archetypes/ or features/ installs fine and
      # fails at runtime, which is what check:publishable exists to catch.
      #
      # No `--provenance`: trusted publishing attests automatically, and no
      # NODE_AUTH_TOKEN, which is the point.
      - name: Publish to npm
        run: npm publish --access public

      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
